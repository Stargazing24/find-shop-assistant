<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家版</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar"></header>

  <div class="container">
    <!-- ========== 进入 ========== -->
    <section id="vEntry">
      <div class="card">
        <div class="section-title" style="margin-top:0">管理我的店</div>
        <div class="hint" style="margin-top:0;margin-bottom:8px">输入开店时拿到的 8 位店铺管理码。</div>
        <div class="pass-form">
          <input type="text" id="codeInput" placeholder="店铺管理码" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="btn" id="codeBtn">进入</button>
        </div>
        <div class="error hidden" id="codeErr"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">入驻新店</div>
        <div class="hint" style="margin-top:0;margin-bottom:8px">把你的微信群菜单搬到这里：拍照上传菜单，AI 识别后核对，生成店铺主页。需要平台提供的入驻口令。</div>
        <div class="pass-form">
          <input type="password" id="joinInput" placeholder="入驻口令" autocomplete="off">
          <button class="btn secondary" id="joinBtn">开始</button>
        </div>
        <div class="hint" id="joinHint"></div>
      </div>
    </section>

    <!-- ========== 新建店铺 ========== -->
    <section id="vNew" class="hidden">
      <div class="card">
        <div class="section-title" style="margin-top:0">第 1 步：拍照识别菜单（可跳过）</div>
        <div id="newPhoto"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">第 2 步：核对菜品</div>
        <div class="hint" style="margin-top:0">标"请确认"的行需要核对后才能发布。</div>
        <div id="newDishes" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">第 3 步：店铺信息</div>
        <div id="newInfo"></div>
        <div class="error hidden" id="newErr"></div>
        <button class="btn" id="publishBtn" style="margin-top:16px">发布店铺主页</button>
        <button class="btn secondary" id="newCancel" style="margin-top:8px">返回</button>
      </div>
    </section>

    <!-- ========== 发布成功：显示管理码 ========== -->
    <section id="vCode" class="hidden">
      <div class="card">
        <div class="success" style="font-size:16px;margin-top:0">发布成功！</div>
        <div style="margin-top:8px">这是你的<strong>店铺管理码</strong>，以后修改菜单、营业时间、优惠都要用它：</div>
        <div class="code-box" id="newCode"></div>
        <div class="error" style="margin-top:0">只显示这一次，请立即截图或抄下来。丢失后需要联系平台管理员重置。</div>
        <button class="btn" id="toDash" style="margin-top:12px">进入我的店铺</button>
      </div>
    </section>

    <!-- ========== 我的店铺 ========== -->
    <section id="vDash" class="hidden">
      <div class="card" style="padding:12px 16px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div><div style="font-size:18px;font-weight:700" id="dName"></div><div class="meta" id="dMeta" style="font-size:13px;color:var(--muted)"></div></div>
          <div class="row-actions" style="flex-shrink:0"><a class="btn-sm" id="dPreview" target="_blank">预览主页</a><button class="btn-sm" id="dLogout">退出</button></div>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="stats" aria-selected="true">数据反馈</button>
        <button role="tab" data-tab="info" aria-selected="false">店铺信息</button>
        <button role="tab" data-tab="menu" aria-selected="false">菜单</button>
        <button role="tab" data-tab="promo" aria-selected="false">优惠</button>
      </div>

      <div data-panel="stats">
        <div class="row-actions" style="margin-bottom:10px">
          <button class="btn-sm primary" data-days="7">近 7 天</button>
          <button class="btn-sm" data-days="30">近 30 天</button>
        </div>
        <div id="statsBox"><div class="card loading">加载中…</div></div>
      </div>

      <div data-panel="info" class="hidden">
        <div class="card">
          <div id="editInfo"></div>
          <div class="error hidden" id="infoErr"></div>
          <button class="btn" id="saveInfo" style="margin-top:16px">保存店铺信息</button>
          <div class="success hidden" id="infoOk">已保存，学生端刷新即可看到。</div>
        </div>
      </div>

      <div data-panel="menu" class="hidden">
        <div class="card">
          <div class="section-title" style="margin-top:0">拍照添加菜品</div>
          <div id="editPhoto"></div>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0">菜单</div>
          <div id="editDishes"></div>
          <div class="error hidden" id="menuErr"></div>
          <button class="btn" id="saveMenu" style="margin-top:16px">保存菜单</button>
          <div class="success hidden" id="menuOk">已保存。</div>
        </div>
      </div>

      <div data-panel="promo" class="hidden">
        <div class="card">
          <div class="section-title" style="margin-top:0">我的优惠</div>
          <div id="promoList"></div>
          <button class="btn secondary" id="promoNew" style="margin-top:10px">+ 新建优惠</button>
        </div>
        <div class="card hidden" id="promoForm">
          <div class="section-title" style="margin-top:0" id="promoFormTitle">新建优惠</div>
          <label>标题 <span style="color:var(--red)">*</span></label>
          <input type="text" id="pTitle" placeholder="如：午市套餐 8 折、满 30 减 5、第二份半价">
          <div class="inline-fields">
            <div><label>类型</label><select id="pKind">
              <option value="percent_off">折扣</option><option value="amount_off">满减</option>
              <option value="special_price">特价</option><option value="gift">赠送</option><option value="other">其他</option></select></div>
            <div><label id="pValueLbl">数值</label><input type="number" id="pValue" min="0" step="0.1" placeholder="选填"></div>
            <div><label>满多少可用（元）</label><input type="number" id="pMin" min="0" step="1" placeholder="选填"></div>
          </div>
          <label>适用菜品（不选 = 全店）</label>
          <div id="pDishes"></div>
          <label>适用星期（不选 = 每天）</label>
          <div id="pWeekdays"></div>
          <div class="inline-fields">
            <div><label>时段开始</label><input type="time" id="pStartT"></div>
            <div><label>时段结束</label><input type="time" id="pEndT"></div>
          </div>
          <div class="inline-fields">
            <div><label>开始日期</label><input type="date" id="pStartD"></div>
            <div><label>结束日期</label><input type="date" id="pEndD"></div>
          </div>
          <label>补充说明</label>
          <input type="text" id="pNote" placeholder="选填，如：仅限堂食">
          <label class="chk" style="margin-top:10px"><input type="checkbox" id="pActive" checked> 立即上架</label>
          <div class="error hidden" id="promoErr"></div>
          <div class="actions">
            <button class="btn secondary" id="promoCancel">取消</button>
            <button class="btn" id="promoSave">保存优惠</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script type="module">
    import * as api from "./js/api.js";
    import { renderNav } from "./js/nav.js";
    import { createPhotoRecognizer, createDishEditor, createInfoForm } from "./js/shop-editor.js";
    import { esc, WEEKDAY_CN, PROMO_KINDS, isPromoActive, promoWhen, promoValueText } from "./js/util.js";
    renderNav("merchant", "商家版");

    const $ = (s) => document.querySelector(s);
    const show = (el, on = true) => el.classList.toggle("hidden", !on);
    const views = ["vEntry", "vNew", "vCode", "vDash"];
    const go = (v) => { views.forEach((x) => show($("#" + x), x === v)); window.scrollTo(0, 0); };

    let code = "";      // 管理码只在内存里，刷新页面需重新输入
    let mine = null;    // {shop, dishes, promotions}
    let days = 7;

    // ================= 进入 =================
    if (api.BACKEND === "local") $("#joinHint").textContent = "本地演示模式：入驻口令随便填即可。";

    async function enter(c) {
      $("#codeErr").classList.add("hidden");
      try {
        const r = await api.openMyShop(c);
        if (!r) { $("#codeErr").textContent = "管理码不正确，请检查后重试。"; show($("#codeErr")); return; }
        code = c; mine = r;
        go("vDash");
        renderDash();
      } catch (e) {
        console.error(e);
        $("#codeErr").textContent = "进入失败：" + (e.message || String(e));
        show($("#codeErr"));
      }
    }
    $("#codeBtn").addEventListener("click", () => { const c = $("#codeInput").value.trim().toUpperCase(); if (c) enter(c); });
    $("#codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#codeBtn").click(); });

    // ================= 新建店铺 =================
    let joinPass = "", t0 = 0, exLog = null;
    const newDishes = createDishEditor($("#newDishes"));
    const newInfo = createInfoForm($("#newInfo"));
    createPhotoRecognizer($("#newPhoto"), (dishes, log) => { newDishes.append(dishes); exLog = log; });

    $("#joinBtn").addEventListener("click", () => {
      joinPass = $("#joinInput").value;
      if (!joinPass && api.BACKEND !== "local") return;
      t0 = Date.now();
      newDishes.set([]); newInfo.set({});
      go("vNew");
    });
    $("#newCancel").addEventListener("click", () => go("vEntry"));

    $("#publishBtn").addEventListener("click", async () => {
      const err = $("#newErr");
      const fail = (m) => { err.textContent = m; show(err); };
      show(err, false);
      const info = newInfo.get();
      if (!info.name) return fail("请填写店名");
      if (newDishes.unconfirmed()) return fail("还有 " + newDishes.unconfirmed() + " 道菜标记「请确认」，请核对后再发布。");
      const dishes = newDishes.get();
      if (!dishes.length) return fail("至少需要一道菜品");
      $("#publishBtn").disabled = true;
      try {
        const r = await api.createShop(joinPass, info, dishes);
        api.logExtraction({
          shopId: r.shopId, model: window.APP_CONFIG && window.APP_CONFIG.model,
          promptVersion: exLog && exLog.promptVersion, raw: exLog && exLog.raw, timings: exLog && exLog.timings,
          attempts: exLog && exLog.attempts, firstTryOk: exLog && exLog.firstTryOk,
          vendorEditedRows: newDishes.editedCount(), totalSeconds: (Date.now() - t0) / 1000,
        });
        $("#newCode").textContent = r.manageCode || "（后端未返回管理码）";
        $("#toDash").onclick = () => r.manageCode ? enter(r.manageCode) : go("vEntry");
        go("vCode");
      } catch (e) {
        console.error(e);
        fail("发布失败：" + (e.message || String(e)));
      } finally {
        $("#publishBtn").disabled = false;
      }
    });

    // ================= 我的店铺 =================
    const editInfo = createInfoForm($("#editInfo"));
    const editDishes = createDishEditor($("#editDishes"));
    createPhotoRecognizer($("#editPhoto"), (dishes) => editDishes.append(dishes));

    async function reload() {
      const r = await api.openMyShop(code);
      if (r) mine = r;
    }

    function renderHeader() {
      const s = mine.shop;
      $("#dName").textContent = s.name;
      $("#dMeta").textContent = [s.area || "区域未填", mine.dishes.length + " 道菜", s.updated_by_merchant_at ? "更新于 " + new Date(s.updated_by_merchant_at).toLocaleString("zh-CN", { hour12: false }) : ""].filter(Boolean).join(" · ");
      $("#dPreview").href = "/shop.html?id=" + encodeURIComponent(s.id);
    }

    function renderDash() {
      renderHeader();
      editInfo.set(mine.shop);
      editDishes.set(mine.dishes);
      renderPromos();
      selectTab("stats");
    }

    function selectTab(t) {
      document.querySelectorAll(".tabs [data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
      document.querySelectorAll("[data-panel]").forEach((p) => show(p, p.dataset.panel === t));
      if (t === "stats") loadStats();
    }
    document.querySelectorAll(".tabs [data-tab]").forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));

    $("#dLogout").addEventListener("click", () => { code = ""; mine = null; $("#codeInput").value = ""; go("vEntry"); });

    // ---------- 数据反馈 ----------
    document.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => {
      days = Number(b.dataset.days);
      document.querySelectorAll("[data-days]").forEach((x) => x.classList.toggle("primary", x === b));
      loadStats();
    }));

    const SRC = { list: "首页列表", filter: "筛选结果", ai: "AI 推荐", direct: "直接打开" };
    function barlist(items, labelFn = (x) => x.key) {
      if (!items || !items.length) return '<div class="empty">暂无数据</div>';
      const max = Math.max(...items.map((x) => x.count));
      return '<ul class="barlist">' + items.map((x) =>
        "<li><span>" + esc(labelFn(x)) + '</span><span class="n">' + x.count + '</span><span class="bar"><i style="width:' + (100 * x.count / max).toFixed(1) + '%"></i></span></li>').join("") + "</ul>";
    }

    async function loadStats() {
      const box = $("#statsBox");
      box.innerHTML = '<div class="card loading">加载中…</div>';
      try {
        const st = await api.getShopStats(code, days);
        const pct = (v) => v == null ? "—" : Math.round(v * 100) + "%";
        box.innerHTML =
          '<div class="stats">'
          + '<div class="stat"><div class="v">' + st.impressions + '</div><div class="k">人次看到你的店</div></div>'
          + '<div class="stat"><div class="v">' + st.clicks + '</div><div class="k">人次点开主页</div></div>'
          + '<div class="stat"><div class="v">' + pct(st.ctr) + '</div><div class="k">点开率</div></div>'
          + '<div class="stat"><div class="v">' + st.aiRecommended + '</div><div class="k">次被 AI 推荐</div></div>'
          + "</div>"
          + '<div class="grid2">'
          + '<div class="card"><div class="section-title" style="margin-top:0">学生从哪里看到你</div>' + barlist(st.sources, (x) => SRC[x.key] || x.key) + "</div>"
          + '<div class="card"><div class="section-title" style="margin-top:0">看到你的学生在筛选什么</div>' + barlist(st.topFilters) + "</div>"
          + "</div>"
          + '<div class="card"><div class="section-title" style="margin-top:0">附近没被满足的需求</div>'
          + '<div class="hint" style="margin-top:0;margin-bottom:6px">学生在' + esc(mine.shop.area || "全站") + '这样筛选或提问，但没有找到任何店。如果你有符合的菜，标记好就能出现在结果里。</div>'
          + barlist(st.unmetDemand, (x) => x.label + "（" + x.via + "）") + "</div>"
          + '<div class="note">统计匿名进行，"人次"按每个浏览器每天去重。不包含学生个人信息。</div>';
      } catch (e) {
        console.error(e);
        box.innerHTML = '<div class="card error">数据加载失败：' + esc(e.message || String(e)) + "</div>";
      }
    }

    // ---------- 店铺信息 ----------
    $("#saveInfo").addEventListener("click", async () => {
      show($("#infoErr"), false); show($("#infoOk"), false);
      const f = editInfo.get();
      if (!f.name) { $("#infoErr").textContent = "店名不能为空"; show($("#infoErr")); return; }
      $("#saveInfo").disabled = true;
      try {
        await api.updateShop(code, f);
        await reload(); renderHeader();
        show($("#infoOk"));
      } catch (e) {
        $("#infoErr").textContent = "保存失败：" + (e.message || String(e)); show($("#infoErr"));
      } finally { $("#saveInfo").disabled = false; }
    });

    // ---------- 菜单 ----------
    $("#saveMenu").addEventListener("click", async () => {
      show($("#menuErr"), false); show($("#menuOk"), false);
      if (editDishes.unconfirmed()) { $("#menuErr").textContent = "还有 " + editDishes.unconfirmed() + " 道菜标记「请确认」，请核对后再保存。"; show($("#menuErr")); return; }
      $("#saveMenu").disabled = true;
      try {
        await api.replaceDishes(code, editDishes.get());
        await reload(); renderHeader(); editDishes.set(mine.dishes); renderPromos();
        show($("#menuOk"));
      } catch (e) {
        $("#menuErr").textContent = "保存失败：" + (e.message || String(e)); show($("#menuErr"));
      } finally { $("#saveMenu").disabled = false; }
    });

    // ---------- 优惠 ----------
    let editingPromo = null;
    const VALUE_LABEL = { percent_off: "优惠百分比（8折填 20）", amount_off: "减多少元", special_price: "特价（元）", gift: "数值", other: "数值" };

    function renderPromos() {
      const nowISO = new Date().toISOString();
      const list = mine.promotions || [];
      $("#promoList").innerHTML = list.length ? list.map((p) => {
        const live = isPromoActive(p, nowISO);
        const status = !p.active ? '<span class="badge unknown" style="margin-left:0">已下架</span>' : live ? '<span class="badge open" style="margin-left:0">展示中</span>' : '<span class="badge unknown" style="margin-left:0">不在有效期</span>';
        return '<div style="padding:10px 0;border-top:1px solid var(--border)">'
          + "<div>" + status + " <strong>" + esc(p.title) + '</strong> <span class="meta">' + esc([PROMO_KINDS[p.kind], promoValueText(p)].filter(Boolean).join(" ")) + "</span></div>"
          + (promoWhen(p) ? '<div class="meta">' + esc(promoWhen(p)) + "</div>" : "")
          + '<div class="row-actions" style="margin-top:6px"><button class="btn-sm" data-edit="' + esc(p.id) + '">编辑</button>'
          + '<button class="btn-sm" data-toggle="' + esc(p.id) + '">' + (p.active ? "下架" : "上架") + "</button></div></div>";
      }).join("") : '<div class="empty">还没有优惠。微信群里发的福利、折扣，可以在这里长期展示给学生。</div>';
      $("#promoList").querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openPromoForm(list.find((p) => p.id === b.dataset.edit))));
      $("#promoList").querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", async () => {
        const p = list.find((x) => x.id === b.dataset.toggle);
        try { await api.setPromotionActive(code, p.id, !p.active); await reload(); renderPromos(); }
        catch (e) { alert("操作失败：" + (e.message || e)); }
      }));
    }

    function openPromoForm(p) {
      editingPromo = p || null;
      const v = p || { kind: "percent_off", dish_ids: [], weekdays: [], active: true };
      $("#promoFormTitle").textContent = p ? "编辑优惠" : "新建优惠";
      $("#pTitle").value = v.title || "";
      $("#pKind").value = v.kind || "other";
      $("#pValue").value = v.value ?? "";
      $("#pMin").value = v.min_spend ?? "";
      $("#pStartT").value = v.start_time || ""; $("#pEndT").value = v.end_time || "";
      $("#pStartD").value = v.start_date || ""; $("#pEndD").value = v.end_date || "";
      $("#pNote").value = v.note || "";
      $("#pActive").checked = v.active !== false;
      $("#pDishes").innerHTML = mine.dishes.length ? mine.dishes.map((d) =>
        '<label class="chk"><input type="checkbox" value="' + esc(d.id) + '"' + ((v.dish_ids || []).includes(d.id) ? " checked" : "") + "> " + esc(d.name) + "</label>").join("") : '<div class="empty">菜单为空</div>';
      $("#pWeekdays").innerHTML = WEEKDAY_CN.map((w, i) =>
        '<label class="chk"><input type="checkbox" value="' + i + '"' + ((v.weekdays || []).includes(i) ? " checked" : "") + "> " + w + "</label>").join("");
      $("#pValueLbl").textContent = VALUE_LABEL[$("#pKind").value];
      show($("#promoErr"), false);
      show($("#promoForm"));
      $("#promoForm").scrollIntoView({ behavior: "smooth" });
    }
    $("#pKind").addEventListener("change", () => { $("#pValueLbl").textContent = VALUE_LABEL[$("#pKind").value]; });
    $("#promoNew").addEventListener("click", () => openPromoForm(null));
    $("#promoCancel").addEventListener("click", () => show($("#promoForm"), false));
    $("#promoSave").addEventListener("click", async () => {
      const num = (el) => el.value === "" ? null : Number(el.value);
      const p = {
        id: editingPromo ? editingPromo.id : undefined,
        title: $("#pTitle").value.trim(),
        kind: $("#pKind").value,
        value: num($("#pValue")),
        min_spend: num($("#pMin")),
        dish_ids: [...$("#pDishes").querySelectorAll("input:checked")].map((x) => x.value),
        weekdays: [...$("#pWeekdays").querySelectorAll("input:checked")].map((x) => Number(x.value)),
        start_time: $("#pStartT").value || null, end_time: $("#pEndT").value || null,
        start_date: $("#pStartD").value || null, end_date: $("#pEndD").value || null,
        note: $("#pNote").value.trim() || null,
        active: $("#pActive").checked,
      };
      if (!p.title) { $("#promoErr").textContent = "请填写优惠标题"; show($("#promoErr")); return; }
      if (p.start_date && p.end_date && p.end_date < p.start_date) { $("#promoErr").textContent = "结束日期早于开始日期"; show($("#promoErr")); return; }
      try {
        await api.savePromotion(code, p);
        await reload(); renderPromos();
        show($("#promoForm"), false);
      } catch (e) {
        $("#promoErr").textContent = "保存失败：" + (e.message || String(e)); show($("#promoErr"));
      }
    });
  </script>
</body>
</html>
