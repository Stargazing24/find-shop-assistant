<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>商家入驻</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="topbar">🏪 商家入驻 <span class="sub">上传菜单 · AI 识别 · 发布主页</span></div>

  <div class="container">
    <!-- 口令 -->
    <div class="card" id="passBox">
      <h2 style="font-size:20px;margin-bottom:12px">请输入商家口令</h2>
      <div class="pass-form">
        <input type="password" id="pass" placeholder="商家口令" autocomplete="off">
        <button class="btn" id="enterBtn">进入</button>
      </div>
      <div class="error" id="err" style="display:none">口令错误，请重试</div>
    </div>

    <!-- 主功能区 -->
    <div id="main" class="hidden">
      <!-- 第 1 步：上传菜单照片 -->
      <div class="card" id="step1">
        <div class="section-title" style="margin-top:0">第 1 步：上传菜单照片</div>
        <input type="file" id="menuFiles" accept="image/*" multiple style="margin-top:8px">
        <div class="hint">可上传 1–3 张菜单照片，AI 会自动识别菜品和价格</div>
        <div id="imgPreview"></div>
        <button class="btn secondary" id="recognizeBtn" style="margin-top:12px" disabled>识别菜单</button>
        <div class="hint" id="recogStatus"></div>
      </div>

      <!-- 第 2 步：编辑识别结果 -->
      <div class="card hidden" id="step2">
        <div class="section-title" style="margin-top:0">第 2 步：核对并编辑菜品</div>
        <div class="hint">标记「请确认」的行需要你核实后再发布；可增删改行、设置辣度/素食/招牌。</div>
        <div id="dishTableWrap" style="overflow-x:auto;margin-top:10px"></div>
        <button class="btn secondary" id="addRowBtn" style="margin-top:10px">+ 手动添加一道菜</button>
      </div>

      <!-- 第 3 步：基本信息 -->
      <div class="card hidden" id="step3">
        <div class="section-title" style="margin-top:0">第 3 步：店铺基本信息</div>

        <label for="shopName">店名 <span style="color:var(--red)">*</span></label>
        <input type="text" id="shopName" placeholder="必填">

        <label for="cuisine">菜系（用顿号分隔，如：粤菜、面食）</label>
        <input type="text" id="cuisine" placeholder="选填">

        <label for="area">区域</label>
        <select id="area"><option value="">未提供</option><option>北门</option><option>南门</option><option>东门</option><option>西门</option></select>

        <label for="address">地址</label>
        <input type="text" id="address" placeholder="选填">

        <label for="avgPrice">人均价格（元）</label>
        <input type="number" id="avgPrice" placeholder="选填" min="0" step="1">

        <label>营业时间</label>
        <div class="hint" style="margin-top:0">勾选「每天相同」可只填一天，其余自动复制</div>
        <label style="margin-top:8px"><input type="checkbox" id="sameEveryday" checked> 每天相同</label>
        <div id="hoursEditor"></div>

        <label for="services">服务方式（用顿号分隔，如：堂食、自取、外卖）</label>
        <input type="text" id="services" placeholder="选填，如：堂食、自取">

        <label for="description">简介</label>
        <textarea id="description" placeholder="选填，一句话介绍你的店"></textarea>

        <label for="contact">联系方式</label>
        <input type="text" id="contact" placeholder="选填">

        <div id="publishError" class="error" style="display:none"></div>
        <button class="btn" id="publishBtn" style="margin-top:16px">发布店铺主页</button>
        <div id="publishResult"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script type="module">
    import * as core from "./core.mjs";

    const App = window.App;
    const $ = (s) => document.querySelector(s);

    const SPICY_CN = ["不辣", "微辣", "中辣", "特辣"];
    const WEEKDAY_CN = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

    let dishes = [];           // 当前识别/编辑的菜品（含 confidence）
    let pendingImages = [];    // 已压缩的 base64 图片
    let passcode = "";         // 口令（仅本次会话内存，用于发布时传给 RPC）
    let startTime = 0;         // 计时

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ---- 口令 ----
    async function verify() {
      const pass = $("#pass").value;
      if (!pass) return;
      try {
        const ok = await App.verifyPasscode("merchant", pass);
        if (ok) {
          passcode = pass;
          sessionStorage.setItem("merchant_authed", "1");
          $("#passBox").classList.add("hidden");
          $("#main").classList.remove("hidden");
        } else {
          $("#err").style.display = "block";
        }
      } catch (e) {
        console.error(e);
        $("#err").textContent = "校验失败：" + (e.message || "网络错误");
        $("#err").style.display = "block";
      }
    }
    $("#enterBtn").addEventListener("click", verify);
    $("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") verify(); });

    // ---- 上传与识别 ----
    async function onFilesChange(e) {
      pendingImages = [];
      $("#imgPreview").innerHTML = "";
      const files = Array.from(e.target.files || []).slice(0, 3);
      $("#recognizeBtn").disabled = files.length === 0;
      for (const f of files) {
        const dataUrl = await App.compressImage(f, 1600, 0.85);
        pendingImages.push(dataUrl);
        $("#imgPreview").insertAdjacentHTML("beforeend", '<img class="img-preview" src="' + dataUrl + '">');
      }
      $("#recogStatus").textContent = files.length ? "已选择 " + files.length + " 张，点击「识别菜单」" : "";
    }
    $("#menuFiles").addEventListener("change", onFilesChange);

    $("#recognizeBtn").addEventListener("click", async () => {
      if (!pendingImages.length) return;
      $("#recogStatus").textContent = "识别中，请稍候…";
      startTime = Date.now();
      try {
        const ex = await core.runExtraction({ images: pendingImages, callLLM: App.callLLM });
        const totalSeconds = (Date.now() - startTime) / 1000;
        if (!ex.ok || !ex.dishes.length) {
          $("#recogStatus").textContent = "识别失败（" + (ex.errors.join("、") || "未识别到菜品") + "），你可以点击下方「手动添加」录入菜品。";
          dishes = [];
        } else {
          dishes = ex.dishes.map((d) => ({
            id: "dish_" + Math.random().toString(36).slice(2, 10),
            name: d.name,
            price: d.price,
            category: d.category,
            spicy_level: d.spicy_level,
            is_vegetarian: d.is_vegetarian,
            is_signature: d.is_signature === true,
            confidence: d.confidence ?? 0.5,
            source: "menu_photo",
            vendor_confirmed: false,
          }));
          $("#recogStatus").textContent = "识别到 " + dishes.length + " 道菜（耗时 " + totalSeconds.toFixed(1) + " 秒）。请核对下面的内容。";
          window._extractionLog = {
            raw: ex.raw,
            timings: ex.timings,
            attempts: ex.attempts,
            firstTryOk: ex.firstTryOk,
            promptVersion: ex.promptVersion,
          };
        }
        $("#step2").classList.remove("hidden");
        renderDishTable();
      } catch (e) {
        console.error(e);
        $("#recogStatus").textContent = "识别失败：" + (e.message || String(e));
      }
    });

    // ---- 菜品编辑表格 ----
    function renderDishTable() {
      const wrap = $("#dishTableWrap");
      if (!dishes.length) {
        wrap.innerHTML = '<div class="hint" style="margin-top:8px">暂无菜品，点击下方「手动添加一道菜」。</div>';
        return;
      }
      let html = '<table><tr><th>菜品名</th><th>价格</th><th>辣度</th><th>素食</th><th>招牌</th><th>操作</th></tr>';
      dishes.forEach((d, i) => {
        const needConfirm = (d.confidence != null && d.confidence < 0.8) ? '<span class="confirm-flag">请确认</span>' : "";
        html += '<tr data-i="' + i + '">'
          + '<td><input type="text" data-field="name" value="' + escapeHtml(d.name) + '">' + needConfirm + "</td>"
          + '<td><input type="number" data-field="price" value="' + (d.price ?? "") + '" style="width:70px" min="0" step="0.5"></td>'
          + '<td><select data-field="spicy_level">'
            + ["未提供", "不辣", "微辣", "中辣", "特辣"].map((s, si) => '<option value="' + (si - 1) + '"' + ((d.spicy_level ?? null) === (si - 1) ? " selected" : "") + ">" + s + "</option>").join("")
          + "</select></td>"
          + '<td><select data-field="is_vegetarian">'
            + '<option value="">未提供</option>'
            + '<option value="true"' + (d.is_vegetarian === true ? " selected" : "") + '>是</option>'
            + '<option value="false"' + (d.is_vegetarian === false ? " selected" : "") + '>否</option>'
          + "</select></td>"
          + '<td><input type="checkbox" data-field="is_signature"' + (d.is_signature ? " checked" : "") + "></td>"
          + '<td><a href="#" data-del="' + i + '" style="color:var(--red)">删除</a></td>'
          + "</tr>";
      });
      html += "</table>";
      wrap.innerHTML = html;

      // 绑定编辑
      wrap.querySelectorAll("input, select").forEach((el) => {
        el.addEventListener("change", () => {
          const i = Number(el.closest("tr").dataset.i);
          const field = el.dataset.field;
          const d = dishes[i];
          if (field === "name") d.name = el.value.trim();
          else if (field === "price") d.price = el.value === "" ? null : Number(el.value);
          else if (field === "spicy_level") d.spicy_level = el.value === "" ? null : Number(el.value);
          else if (field === "is_vegetarian") d.is_vegetarian = el.value === "" ? null : el.value === "true";
          else if (field === "is_signature") d.is_signature = el.checked;
          // 用户改过 → 视为已确认
          d.vendor_confirmed = true;
          d.confidence = 1;
          d.source = d.source || "vendor_input";
        });
      });
      wrap.querySelectorAll("[data-del]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          dishes.splice(Number(el.dataset.del), 1);
          renderDishTable();
        });
      });
    }

    $("#addRowBtn").addEventListener("click", () => {
      dishes.push({ id: "dish_" + Math.random().toString(36).slice(2, 10), name: "", price: null, category: null, spicy_level: null, is_vegetarian: null, is_signature: false, confidence: 1, source: "vendor_input", vendor_confirmed: true });
      renderDishTable();
      $("#step3").classList.remove("hidden");
    });

    // ---- 营业时间编辑器 ----
    function buildHoursEditor() {
      const wrap = $("#hoursEditor");
      wrap.innerHTML = "";
      const weekdays = $("#sameEveryday").checked ? [0] : [0, 1, 2, 3, 4, 5, 6];
      for (const wd of weekdays) {
        const label = $("#sameEveryday").checked ? "每天" : WEEKDAY_CN[wd];
        wrap.insertAdjacentHTML("beforeend",
          '<div class="hours-row"><label>' + label + '</label>'
          + '<input type="time" data-wd="' + wd + '" data-field="open">'
          + '<span>–</span>'
          + '<input type="time" data-wd="' + wd + '" data-field="close">'
          + "</div>");
      }
    }
    $("#sameEveryday").addEventListener("change", buildHoursEditor);
    buildHoursEditor();

    function collectHours() {
      const rows = $("#hoursEditor").querySelectorAll(".hours-row");
      const entries = [];
      for (const r of rows) {
        const wd = Number(r.querySelector("[data-field=open]").dataset.wd);
        const open = r.querySelector("[data-field=open]").value;
        const close = r.querySelector("[data-field=close]").value;
        if (!open || !close) continue;
        if ($("#sameEveryday").checked) {
          for (let d = 0; d < 7; d++) entries.push({ weekday: d, open, close });
          break;
        } else {
          entries.push({ weekday: wd, open, close });
        }
      }
      return entries;
    }

    // ---- 发布 ----
    $("#publishBtn").addEventListener("click", async () => {
      const name = $("#shopName").value.trim();
      if (!name) { $("#publishError").textContent = "请填写店名"; $("#publishError").style.display = "block"; return; }

      // 检查是否有未确认行（confidence < 0.8 且未被修改）
      const unconfirmed = dishes.filter((d) => (d.confidence != null && d.confidence < 0.8) && !d.vendor_confirmed);
      if (unconfirmed.length) {
        $("#publishError").textContent = "还有 " + unconfirmed.length + " 道菜标记「请确认」，请核实或删除后再发布。";
        $("#publishError").style.display = "block";
        $("#step2").scrollIntoView();
        return;
      }

      // 过滤掉空菜名
      const validDishes = dishes.filter((d) => d.name && d.name.trim());
      if (!validDishes.length) { $("#publishError").textContent = "至少需要一道菜品"; $("#publishError").style.display = "block"; return; }

      const shop = {
        name,
        cuisine: $("#cuisine").value.split(/[、,，\s]+/).filter(Boolean),
        area: $("#area").value || null,
        address: $("#address").value.trim() || null,
        avg_price: $("#avgPrice").value === "" ? null : Number($("#avgPrice").value),
        opening_hours: collectHours(),
        services: $("#services").value.split(/[、,，\s]+/).filter(Boolean),
        description: $("#description").value.trim() || null,
        contact: $("#contact").value.trim() || null,
      };
      const dishPayload = validDishes.map((d) => ({
        id: d.id,
        name: d.name,
        price: d.price,
        category: d.category,
        spicy_level: d.spicy_level,
        is_vegetarian: d.is_vegetarian,
        is_signature: d.is_signature === true,
        confidence: d.confidence,
        source: d.source,
        vendor_confirmed: true,
      }));

      $("#publishBtn").disabled = true;
      $("#publishBtn").textContent = "发布中…";
      try {
        const shopId = await App.publishShop(passcode, shop, dishPayload);
        const totalSeconds = (Date.now() - startTime) / 1000;

        // 写 extraction_logs
        const vendorEditedRows = dishes.filter((d) => d.vendor_confirmed).length;
        App.logExtraction({
          shopId,
          model: App.cfg.model,
          promptVersion: window._extractionLog?.promptVersion ?? null,
          raw: window._extractionLog?.raw ?? null,
          timings: window._extractionLog?.timings ?? null,
          attempts: window._extractionLog?.attempts ?? null,
          firstTryOk: window._extractionLog?.firstTryOk ?? null,
          vendorEditedRows,
          totalSeconds,
        }).catch(() => {});

        $("#publishError").style.display = "none";
        $("#publishResult").innerHTML = '<div class="success">发布成功！</div>'
          + '<div style="margin-top:10px"><a href="/shop.html?id=' + encodeURIComponent(shopId) + '">查看店铺主页 →</a></div>';
      } catch (e) {
        console.error(e);
        $("#publishError").textContent = "发布失败：" + (e.message || String(e));
        $("#publishError").style.display = "block";
      } finally {
        $("#publishBtn").disabled = false;
        $("#publishBtn").textContent = "发布店铺主页";
      }
    });

    // 识别完成后或手动添加时，逐步显示步骤
    $("#step2").addEventListener("click", () => {});
    // 菜品表格有内容就显示基本信息
    const obs = new MutationObserver(() => { $("#step3").classList.remove("hidden"); });
    obs.observe($("#dishTableWrap"), { childList: true, subtree: true });

    // 若已通过口令（会话内），直接进入
    if (sessionStorage.getItem("merchant_authed") === "1") {
      $("#passBox").classList.add("hidden");
      $("#main").classList.remove("hidden");
      // 注意：passcode 需要重新输入，因为 sessionStorage 不存口令明文
    }
  </script>
</body>
</html>
