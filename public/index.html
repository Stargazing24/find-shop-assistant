<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找店助手</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .ask-row { display: flex; gap: 8px; }
    .ask-row input { flex: 1; min-width: 0; }
    .ask-row .btn { width: auto; flex-shrink: 0; padding: 10px 16px; font-size: 15px; }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .examples .chip { font-size: 13px; white-space: normal; text-align: left; }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 14px;
      line-height: 1.3;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:active { background: #f3f4f6; }
    .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
    .list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 8px; }
    .list-head .title { font-size: 16px; font-weight: 600; }
    .list-head .count { font-size: 13px; color: var(--muted); }
    .linkbtn { background: none; border: none; color: var(--primary); font-size: 13px; cursor: pointer; padding: 0; }

    a.shop-card { display: block; color: inherit; text-decoration: none; }
    a.shop-card:active { background: #fafafa; }
    .shop-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .shop-card .top > .badge { margin-left: 0; flex-shrink: 0; }
    .shop-card .dishes { font-size: 14px; color: var(--text); margin-top: 6px; }
    .shop-card .dishes .lbl { color: var(--muted); font-size: 13px; }
    .shop-card .price { color: var(--primary); }
    .note-box { font-size: 13px; color: var(--muted); padding: 2px 4px 10px; }
    .answer { font-size: 15px; white-space: pre-wrap; }
    .ai-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .ai-head .title { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <header id="topbar"></header>

  <div class="container">
    <!-- 上方：AI 提问 -->
    <div class="card">
      <div class="ask-row">
        <input type="text" id="query" placeholder="想吃什么？如：30块以内不辣的晚饭" enterkeyhint="search">
        <button class="btn" id="askBtn">问一问</button>
      </div>
      <div class="examples">
        <button class="chip example-q" data-q="30块以内、不辣、现在还开着的晚饭">30块以内、不辣、现在还开着的晚饭</button>
        <button class="chip example-q" data-q="有没有素食">有没有素食</button>
        <button class="chip example-q" data-q="北门附近有什么面">北门附近有什么面</button>
      </div>
      <div class="hint" id="quotaHint"></div>
    </div>

    <div id="aiResult"></div>

    <!-- 中间：筛选按钮（多选，浏览器内用 core.search 筛选，不调用 AI） -->
    <div class="filters" id="filters">
      <button class="chip" data-f="open" aria-pressed="false">营业中</button>
      <button class="chip" data-f="budget30" aria-pressed="false">30元内</button>
      <button class="chip" data-f="nospicy" aria-pressed="false">不辣</button>
      <button class="chip" data-f="veg" aria-pressed="false">素食</button>
      <button class="chip" data-f="promo" aria-pressed="false">有优惠</button>
      <button class="chip" data-area="北门" aria-pressed="false">北门</button>
      <button class="chip" data-area="南门" aria-pressed="false">南门</button>
      <button class="chip" data-area="东门" aria-pressed="false">东门</button>
    </div>

    <!-- 下方：已核实店铺列表 -->
    <div class="list-head">
      <span class="title">已核实店铺</span>
      <span class="count" id="listCount"></span>
    </div>
    <div id="shopList"><div class="card loading">加载中…</div></div>
    <div class="footer-note">本站匿名统计浏览和筛选次数，用于帮助商家了解需求，不收集任何个人信息。</div>
  </div>

  <!-- 依赖：SDK + config + app.js（数据服务），页面只通过 js/api.js 读取数据 -->
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script type="module">
    import * as core from "./core.mjs";
    import { getVerifiedShopsAndDishes, findShops, logEvent, DEMO_MODE } from "./js/api.js";
    import { renderNav } from "./js/nav.js";
    import { isPromoActive } from "./js/util.js";
    renderNav("student", "学生找店 · 免登录");

    const $ = (s) => document.querySelector(s);
    const MAX_Q = (window.APP_CONFIG && window.APP_CONFIG.maxQuestionsPerSession) || 20;

    let shops = [], dishes = [], promotions = [], shopsById = {}, dishesById = {};
    const activePromos = (shopId, nowISO) => promotions.filter((p) => p.shop_id === shopId && isPromoActive(p, nowISO));

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function openBadge(st) {
      if (st === true) return '<span class="badge open">营业中</span>';
      if (st === false) return '<span class="badge closed">已打烊</span>';
      return '<span class="badge unknown">营业时间未提供</span>';
    }

    // 一张店铺卡片。c 为 core.search / runFindPipeline 返回的候选；dishLabel 为菜品行标签
    function shopCard(c, nowISO, dishLabel, source) {
      const s = shopsById[c.shopId] || { name: c.shopName };
      const st = core.isOpen(s, nowISO);
      let ds = c.matchedDishes || [];
      let label = dishLabel;
      if (!label) {
        // 无菜品条件时：有招牌菜只显示招牌菜，否则显示前几道菜
        const sig = ds.filter((d) => dishesById[d.id] && dishesById[d.id].is_signature === true);
        if (sig.length) { ds = sig; label = "招牌"; } else label = "菜品";
      }
      const dishHtml = ds.length
        ? '<div class="dishes"><span class="lbl">' + label + "：</span>"
          + ds.map((d) => esc(d.name) + (d.price != null ? ' <span class="price">¥' + esc(d.price) + "</span>" : "")).join("、")
          + "</div>"
        : "";
      const avg = s.avg_price != null ? "人均 ¥" + esc(s.avg_price) : "人均未提供";
      const area = s.area ? esc(s.area) : "区域未提供";
      const promos = activePromos(c.shopId, nowISO);
      const promoHtml = promos.length ? '<div class="promo-line">🏷 ' + promos.map((p) => esc(p.title)).join("；") + "</div>" : "";
      return '<a class="shop-card" data-shop="' + esc(c.shopId) + '" data-src="' + source + '" href="/shop.html?id=' + encodeURIComponent(c.shopId) + "&from=" + source + '">'
        + '<div class="top"><div class="name">' + esc(s.name)
        + (s.is_demo ? '<span class="badge demo">演示数据</span>' : "") + "</div>"
        + openBadge(st) + "</div>"
        + '<div class="meta">' + avg + " · " + area + "</div>"
        + dishHtml
        + promoHtml
        + "</a>";
    }

    // ---------------- 筛选 ----------------
    const state = { open: false, budget30: false, nospicy: false, veg: false, promo: false, areas: new Set() };

    function currentFilters(area) {
      return {
        open_at: state.open ? "now" : null,
        budget: state.budget30 ? 30 : null,
        spicy: state.nospicy ? "no_spicy" : null,
        vegetarian: state.veg ? true : null,
        area: area || null,
        cuisine: [], dish_keywords: [], unsupported: [],
      };
    }

    function renderList() {
      const nowISO = new Date().toISOString();
      // 区域之间是"或"，其他条件之间是"且"：每个区域各调一次 core.search，结果合并
      const areas = state.areas.size ? [...state.areas] : [null];
      const seen = new Map(), unknown = new Set();
      for (const a of areas) {
        const r = core.search(shops, dishes, currentFilters(a), nowISO, { includeDemo: DEMO_MODE });
        for (const c of r.candidates) if (!seen.has(c.shopId)) seen.set(c.shopId, c);
        for (const id of r.unknownHoursShopIds) unknown.add(id);
      }
      let list = [...seen.values()];
      // "有优惠"不是 core 的筛选条件，在 core.search 结果上再过滤
      if (state.promo) list = list.filter((c) => activePromos(c.shopId, nowISO).length > 0);
      list = list.map((c) => ({ c, open: core.isOpen(shopsById[c.shopId] || {}, nowISO) }));
      // 显示全部符合条件的店：营业中优先，再按匹配菜品多、最低价低、店名
      list.sort((x, y) =>
        (y.open === true) - (x.open === true) ||
        y.c.matchCount - x.c.matchCount ||
        (x.c.minPrice ?? Infinity) - (y.c.minPrice ?? Infinity) ||
        String(x.c.shopName).localeCompare(String(y.c.shopName), "zh"));

      const dishFilter = state.budget30 || state.nospicy || state.veg;
      const anyFilter = dishFilter || state.open || state.promo || state.areas.size > 0;
      const source = anyFilter ? "filter" : "list";
      $("#listCount").innerHTML = anyFilter
        ? "符合条件 " + list.length + ' 家 · <button class="linkbtn" id="clearF">清除筛选</button>'
        : "共 " + list.length + " 家";
      const clear = $("#clearF");
      if (clear) clear.addEventListener("click", clearFilters);

      let html = list.length
        ? list.map((x) => shopCard(x.c, nowISO, dishFilter ? "匹配菜品" : null, source)).join("")
        : '<div class="card" style="color:var(--muted);font-size:14px">没有同时符合这些条件的店，试试少选几个。</div>';
      const unknownNames = [...unknown].filter((id) => !seen.has(id)).map((id) => shopsById[id] && shopsById[id].name).filter(Boolean);
      if (unknownNames.length) html += '<div class="note-box">另有 ' + unknownNames.map(esc).join("、") + " 营业时间未提供，无法判断现在是否营业。</div>";
      $("#shopList").innerHTML = html;
      const ef = eventFilters();
      logEvent(list.map((x) => ({ event: "impression", shopId: x.c.shopId, source, filters: anyFilter ? ef : null })));
      return list.length;
    }

    // 记录到 shop_events 的筛选条件（区域可多选，所以用 areas 数组）
    function eventFilters() {
      return {
        open_at: state.open ? "now" : null, budget: state.budget30 ? 30 : null,
        spicy: state.nospicy ? "no_spicy" : null, vegetarian: state.veg ? true : null,
        promo: state.promo || null, areas: [...state.areas],
      };
    }

    function clearFilters() {
      state.open = state.budget30 = state.nospicy = state.veg = state.promo = false;
      state.areas.clear();
      document.querySelectorAll("#filters .chip").forEach((b) => b.setAttribute("aria-pressed", "false"));
      renderList();
    }

    let loaded = false;
    document.querySelectorAll("#filters .chip").forEach((b) => {
      b.addEventListener("click", () => {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        if (b.dataset.area) on ? state.areas.add(b.dataset.area) : state.areas.delete(b.dataset.area);
        else state[b.dataset.f] = on;
        if (loaded) {
          const n = renderList();
          logEvent({ event: "filter_used", filters: eventFilters(), resultCount: n });
        }
      });
    });

    // ---------------- AI 提问 ----------------
    let count = Number(localStorage.getItem("findshop_q_count") || 0);
    function updateQuota() {
      $("#quotaHint").textContent = "AI 提问每台设备最多 " + MAX_Q + " 次，剩余 " + Math.max(0, MAX_Q - count) + " 次";
    }
    updateQuota();

    const aiEl = $("#aiResult");
    let asking = false;

    async function ask(q) {
      if (asking) return;
      if (count >= MAX_Q) {
        aiEl.innerHTML = '<div class="card error">AI 提问次数已达上限（' + MAX_Q + ' 次）。可以用下面的筛选按钮继续找店。</div>';
        return;
      }
      asking = true;
      $("#askBtn").disabled = true;
      aiEl.innerHTML = '<div class="card loading">正在为你找店…</div>';
      try {
        const r = await findShops(q);
        count += 1;
        localStorage.setItem("findshop_q_count", String(count));
        updateQuota();
        renderAI(r, q);
      } catch (e) {
        console.error(e);
        aiEl.innerHTML = '<div class="card error">请求失败：' + esc(e.message || String(e)) + "</div>";
      } finally {
        asking = false;
        $("#askBtn").disabled = false;
      }
    }

    function renderAI(r, q) {
      const nowISO = new Date().toISOString();
      let html = '<div class="card"><div class="ai-head"><span class="title">「' + esc(q) + '」</span>'
        + '<button class="linkbtn" id="closeAI">收起</button></div>'
        + '<div class="answer">' + esc(r.answer || "") + "</div></div>";
      for (const c of r.candidates || []) html += shopCard(c, nowISO, "匹配菜品", "ai");
      logEvent((r.candidates || []).map((c) => ({ event: "impression", shopId: c.shopId, source: "ai", filters: r.filters })));
      if (r.filters) {
        html += '<details style="margin:2px 4px 14px"><summary>系统理解的条件</summary>'
          + '<pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--muted)">'
          + esc(JSON.stringify(r.filters, null, 2)) + "</pre></details>";
      }
      aiEl.innerHTML = html;
      $("#closeAI").addEventListener("click", () => { aiEl.innerHTML = ""; });
    }

    $("#askBtn").addEventListener("click", () => { const q = $("#query").value.trim(); if (q) ask(q); });
    $("#query").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("#askBtn").click(); } });
    document.querySelectorAll(".example-q").forEach((b) =>
      b.addEventListener("click", () => { $("#query").value = b.dataset.q; ask(b.dataset.q); }));

    // ---------------- 初始加载 ----------------
    async function init() {
      try {
        ({ shops, dishes, promotions } = await getVerifiedShopsAndDishes());
        shopsById = Object.fromEntries(shops.map((s) => [s.id, s]));
        dishesById = Object.fromEntries(dishes.map((d) => [d.id, d]));
        loaded = true;
        renderList();
      } catch (e) {
        console.error(e);
        $("#shopList").innerHTML = '<div class="card error">店铺加载失败：' + esc(e.message || String(e)) + "</div>";
      }
    }
    // 点开卡片（列表、筛选结果、AI 结果都走这里）
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a.shop-card[data-shop]");
      if (a) logEvent({ event: "card_click", shopId: a.dataset.shop, source: a.dataset.src });
    });
    init();
  </script>
</body>
</html>
