<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据中控台</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .trend { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: end; height: 120px; padding-top: 8px; }
    .trend .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
    .trend .b { width: 70%; max-width: 28px; background: var(--primary); border-radius: 3px 3px 0 0; min-height: 2px; }
    .trend .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .trend .d { font-size: 10px; color: #9ca3af; margin-top: 2px; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    [data-panel] th, [data-panel] td { white-space: nowrap; }
    [data-panel] td.qtext { white-space: normal; min-width: 160px; max-width: 260px; }
    .tabs { max-width: 100%; }
  </style>
</head>
<body>
  <header id="topbar"></header>

  <div class="container wide">
    <section id="vLogin" class="card pass-box" style="max-width:420px;margin:24px auto">
      <h2>管理员登录</h2>
      <div class="pass-form">
        <input type="password" id="pass" placeholder="管理员口令" autocomplete="off">
        <button class="btn" id="loginBtn">进入</button>
      </div>
      <div class="hint" id="loginHint"></div>
      <div class="error hidden" id="loginErr"></div>
    </section>

    <section id="vMain" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <div class="tabs" role="tablist" style="margin-bottom:0;border-bottom:none">
          <button role="tab" data-tab="overview" aria-selected="true">总览</button>
          <button role="tab" data-tab="demand" aria-selected="false">需求洞察</button>
          <button role="tab" data-tab="shops" aria-selected="false">店铺管理</button>
          <button role="tab" data-tab="queries" aria-selected="false">提问记录</button>
          <button role="tab" data-tab="tools" aria-selected="false">工具</button>
        </div>
        <div class="row-actions">
          <button class="btn-sm primary" data-days="7">近 7 天</button>
          <button class="btn-sm" data-days="30">近 30 天</button>
          <button class="btn-sm" id="refresh">刷新</button>
        </div>
      </div>

      <div data-panel="overview"></div>
      <div data-panel="demand" class="hidden"></div>
      <div data-panel="shops" class="hidden"></div>
      <div data-panel="queries" class="hidden"></div>
      <div data-panel="tools" class="hidden">
        <div class="card">
          <div class="section-title" style="margin-top:0">评估</div>
          <div class="hint" style="margin-top:0">批量运行评估用例、下载结果 JSON。</div>
          <a class="btn-sm" href="/eval.html" style="display:inline-block;margin-top:8px">打开评估页 →</a>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0">数据后端</div>
          <div class="hint" style="margin-top:0" id="backendInfo"></div>
          <div class="row-actions" style="margin-top:8px">
            <button class="btn-sm" id="toLocal">切换到本地演示</button>
            <button class="btn-sm" id="toCloud">切换到云端</button>
            <button class="btn-sm danger" id="resetLocal">清空本地数据并重新导入演示店</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script type="module">
    import * as api from "./js/api.js";
    import { renderNav } from "./js/nav.js";
    import { esc, filtersLabel } from "./js/util.js";
    renderNav("admin", "数据中控台");

    const $ = (s) => document.querySelector(s);
    const show = (el, on = true) => el.classList.toggle("hidden", !on);
    const panel = (k) => document.querySelector(`[data-panel="${k}"]`);
    let pass = "", days = 7, tab = "overview", data = null, shops = null;

    if (api.BACKEND === "local") $("#loginHint").textContent = "本地演示模式：口令随便填即可。";

    async function login() {
      const p = $("#pass").value;
      if (!p && api.BACKEND !== "local") return;
      show($("#loginErr"), false);
      try {
        if (!(await api.adminLogin(p))) { $("#loginErr").textContent = "口令错误"; show($("#loginErr")); return; }
        pass = p;
        show($("#vLogin"), false); show($("#vMain"));
        load();
      } catch (e) {
        $("#loginErr").textContent = "登录失败：" + (e.message || String(e)); show($("#loginErr"));
      }
    }
    $("#loginBtn").addEventListener("click", login);
    $("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

    document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
      tab = b.dataset.tab;
      document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
      document.querySelectorAll("[data-panel]").forEach((p) => show(p, p.dataset.panel === tab));
    }));
    document.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => {
      days = Number(b.dataset.days);
      document.querySelectorAll("[data-days]").forEach((x) => x.classList.toggle("primary", x === b));
      load();
    }));
    $("#refresh").addEventListener("click", load);

    const pct = (v) => v == null ? "—" : Math.round(v * 100) + "%";
    const stat = (v, k) => '<div class="stat"><div class="v">' + v + '</div><div class="k">' + k + "</div></div>";
    function barlist(items, labelFn = (x) => x.key, valFn = (x) => x.count) {
      if (!items || !items.length) return '<div class="empty">暂无数据</div>';
      const max = Math.max(1, ...items.map(valFn));
      return '<ul class="barlist">' + items.map((x) =>
        "<li><span>" + esc(labelFn(x)) + '</span><span class="n">' + valFn(x) + '</span><span class="bar"><i style="width:' + (100 * valFn(x) / max).toFixed(1) + '%"></i></span></li>').join("") + "</ul>";
    }
    function trend(rows, key, title) {
      const max = Math.max(1, ...rows.map((r) => r[key]));
      return '<div class="card"><div class="section-title" style="margin-top:0">' + title + '</div><div class="trend">'
        + rows.map((r) => '<div class="col" title="' + r.date + "：" + r[key] + '"><span class="n">' + (r[key] || "") + '</span><div class="b" style="height:' + (100 * r[key] / max).toFixed(1) + '%"></div><span class="d">' + r.date.slice(5) + "</span></div>").join("")
        + "</div></div>";
    }

    async function load() {
      document.querySelectorAll("[data-panel]:not([data-panel=tools])").forEach((p) => { p.innerHTML = '<div class="card loading">加载中…</div>'; });
      try {
        [data, shops] = await Promise.all([api.getAdminOverview(pass, days), api.listAllShops(pass)]);
        renderOverview(); renderDemand(); renderShops(); renderQueries();
      } catch (e) {
        console.error(e);
        document.querySelectorAll("[data-panel]:not([data-panel=tools])").forEach((p) => { p.innerHTML = '<div class="card error">加载失败：' + esc(e.message || String(e)) + "</div>"; });
      }
      $("#backendInfo").textContent = "当前：" + (api.BACKEND === "local" ? "本地演示（数据只在这个浏览器）" : "云端数据库");
    }

    function renderOverview() {
      const t = data.totals;
      panel("overview").innerHTML =
        '<div class="stats">'
        + stat(t.verifiedShops, "已核实店铺") + stat(t.unverifiedShops, "未核实店铺") + stat(t.dishes, "菜品") + stat(t.activePromotions, "生效中的优惠")
        + "</div>"
        + '<div class="stats">'
        + stat(t.visits, "访问人次") + stat(t.clicks, "点开店铺") + stat(t.filterUses, "筛选次数") + stat(t.aiQueries, "AI 提问")
        + stat(pct(t.aiNoResultRate), "AI 无结果率") + stat(pct(t.aiTemplateRate), "AI 模板兜底率")
        + "</div>"
        + '<div class="grid2">' + trend(data.byDay, "visits", "每日访问人次") + trend(data.byDay, "aiQueries", "每日 AI 提问") + "</div>"
        + '<div class="card"><div class="section-title" style="margin-top:0">店铺热度排行</div>' + rankingTable(data.ranking) + "</div>"
        + '<div class="note">统计范围：近 ' + data.days + ' 天。全部为匿名数据，"人次"按每个浏览器每天去重。</div>';
    }

    function rankingTable(rows) {
      if (!rows.length) return '<div class="empty">暂无数据</div>';
      return '<div style="overflow-x:auto"><table><tr><th>店铺</th><th>区域</th><th class="num">看到</th><th class="num">点开</th><th class="num">点开率</th><th class="num">AI 推荐</th></tr>'
        + rows.map((r) => "<tr><td><a href=\"/shop.html?id=" + encodeURIComponent(r.shopId) + "\" target=\"_blank\">" + esc(r.name) + "</a></td><td>" + esc(r.area || "—") + '</td><td class="num">' + r.impressions + '</td><td class="num">' + r.clicks + '</td><td class="num">' + pct(r.ctr) + '</td><td class="num">' + r.aiRecommended + "</td></tr>").join("")
        + "</table></div>";
    }

    function renderDemand() {
      panel("demand").innerHTML =
        '<div class="card"><div class="section-title" style="margin-top:0">没被满足的需求</div>'
        + '<div class="hint" style="margin-top:0;margin-bottom:6px">学生筛选或提问后一家店都没找到的条件。可以用来招募对应的商家。</div>'
        + barlist(data.unmetDemand, (x) => x.label + "（" + x.via + "）") + "</div>"
        + '<div class="grid2">'
        + '<div class="card"><div class="section-title" style="margin-top:0">最常用的筛选条件</div>' + barlist(data.topFilters) + "</div>"
        + '<div class="card"><div class="section-title" style="margin-top:0">各区域：需求 vs 店铺数</div>'
        + (data.areas.length ? '<table><tr><th>区域</th><th class="num">需求次数</th><th class="num">已核实店铺</th></tr>'
          + data.areas.map((a) => "<tr><td>" + esc(a.area) + '</td><td class="num">' + a.demand + '</td><td class="num">' + a.shops + "</td></tr>").join("") + "</table>"
          : '<div class="empty">暂无数据</div>')
        + "</div></div>";
    }

    function renderShops() {
      const rows = shops.slice().sort((a, b) => (b.verified === true) - (a.verified === true) || String(a.name).localeCompare(String(b.name), "zh"));
      panel("shops").innerHTML = '<div id="codeShow"></div><div class="card"><div style="overflow-x:auto"><table><tr><th>店铺</th><th>区域</th><th class="num">菜品</th><th class="num">优惠</th><th>状态</th><th>操作</th></tr>'
        + rows.map((s) => "<tr><td>" + esc(s.name) + (s.is_demo ? ' <span class="badge demo">演示</span>' : "") + '<div class="note">' + esc(s.id) + "</div></td><td>" + esc(s.area || "—")
          + '</td><td class="num">' + (s.dishCount ?? "—") + '</td><td class="num">' + (s.promoCount ?? "—") + "</td><td>"
          + (s.verified ? '<span class="badge open" style="margin-left:0">已核实</span>' : '<span class="badge unknown" style="margin-left:0">未核实</span>') + "</td>"
          + '<td><div class="row-actions">'
          + '<button class="btn-sm" data-verify="' + esc(s.id) + '" data-v="' + (s.verified ? "0" : "1") + '">' + (s.verified ? "下线" : "核实上线") + "</button>"
          + '<button class="btn-sm" data-reset="' + esc(s.id) + '">重置管理码</button>'
          + "</div></td></tr>").join("")
        + "</table></div>"
        + '<div class="note">"下线"后学生端看不到这家店；"重置管理码"会让旧管理码失效，新码只显示一次，请转交给商家。</div></div>';
      panel("shops").querySelectorAll("[data-verify]").forEach((b) => b.addEventListener("click", async () => {
        try { await api.setShopVerified(pass, b.dataset.verify, b.dataset.v === "1"); load(); }
        catch (e) { alert("操作失败：" + (e.message || e)); }
      }));
      panel("shops").querySelectorAll("[data-reset]").forEach((b) => b.addEventListener("click", async () => {
        const s = shops.find((x) => x.id === b.dataset.reset);
        if (!confirm("确定重置「" + s.name + "」的管理码？旧管理码将立即失效。")) return;
        try {
          const c = await api.resetManageCode(pass, s.id);
          $("#codeShow").innerHTML = '<div class="card"><div>「' + esc(s.name) + '」的新管理码（只显示这一次，请复制后转交商家）：</div><div class="code-box">' + esc(c) + '</div><button class="btn-sm" id="codeHide">我已记下，隐藏</button></div>';
          $("#codeHide").addEventListener("click", () => { $("#codeShow").innerHTML = ""; });
          $("#codeShow").scrollIntoView({ behavior: "smooth" });
        }
        catch (e) { alert("操作失败：" + (e.message || e)); }
      }));
    }

    function renderQueries() {
      const rows = data.recentQueries || [];
      panel("queries").innerHTML = '<div class="card">'
        + (rows.length ? '<div style="overflow-x:auto"><table><tr><th>时间</th><th>问题</th><th>系统理解</th><th class="num">结果</th><th>方式</th></tr>'
          + rows.map((q) => "<tr><td style=\"white-space:nowrap\">" + esc(new Date(q.created_at).toLocaleString("zh-CN", { hour12: false })) + '</td><td class="qtext">' + esc(q.query)
            + "</td><td>" + esc(filtersLabel(q.filters)) + (q.filters && q.filters.unsupported && q.filters.unsupported.length ? '<div class="note">无数据支持：' + esc(q.filters.unsupported.join("、")) + "</div>" : "")
            + '</td><td class="num">' + (q.candidate_shop_ids || []).length + "</td><td>" + esc(q.parser || "—") + (q.used_template ? ' <span class="badge unknown">模板</span>' : "") + "</td></tr>").join("")
          + "</table></div>"
          : '<div class="empty">近 ' + data.days + " 天没有 AI 提问。</div>")
        + '<div class="note">最多显示最近 30 条。问题文本由学生匿名输入。</div></div>';
    }

    // ---------- 工具 ----------
    $("#toLocal").addEventListener("click", () => api.setBackend("local"));
    $("#toCloud").addEventListener("click", () => api.setBackend("cloud"));
    $("#resetLocal").addEventListener("click", async () => {
      if (!confirm("清空本浏览器里的全部本地数据（商家新建的店、优惠、统计），并重新导入演示店？")) return;
      try { await api.resetLocalData(); load(); } catch (e) { alert(e.message || e); }
    });
  </script>
</body>
</html>
